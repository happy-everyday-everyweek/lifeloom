plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.lifeloom.shell.android'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.lifeloom.android'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':core')
}